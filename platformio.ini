; -----------------------------------------------------------------------------
; SpiceDispenser – PlatformIO config (ESP32-C6 + Arduino)
; Reproducible build with pinned platform + libraries.
; -----------------------------------------------------------------------------

[env:esp32-c6]
platform      = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
board         = esp32-c6-devkitm-1
framework     = arduino

; --- Serial/Flashing ---------------------------------------------------------
monitor_speed = 115200
upload_speed  = 921600
; upload_port  = COM6
; monitor_port = COM6
monitor_dtr   = 0
monitor_rts   = 0

; --- Libraries (pinned) ------------------------------------------------------
; ESP32Servo: actively maintained fork for ESP32
; ArduinoJson: v7 API (matches your code)
; U8g2: graphics lib for OLED
lib_deps =
  madhephaestus/ESP32Servo @ ^1.1.3
  bblanchon/ArduinoJson    @ ^7.0.4
  olikraus/U8g2            @ ^2.35.15

; --- Build flags -------------------------------------------------------------
; Enable native USB CDC (serial over USB) on ESP32-C6
build_flags =
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1

; --- (Optional) Useful monitor filters --------------------------------------
; monitor_filters = time, default
